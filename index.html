<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake - Fun Cool Game</title>
<style>
body {
  margin: 0;
  background: #0a0a1a;
  color: #00ffcc;
  font-family: 'Courier New', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}
h1 {
  text-shadow: 0 0 10px #00ffcc;
  margin-bottom: 10px;
}
canvas {
  border: 3px solid #00ffcc;
  box-shadow: 0 0 20px #00ffcc;
  background: #000;
}
#score {
  font-size: 1.5em;
  margin: 10px;
  text-shadow: 0 0 5px #ff00ff;
}
#gameOver {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.8);
  padding: 30px;
  border: 2px solid #ff0066;
  text-align: center;
  box-shadow: 0 0 20px #ff0066;
}
button {
  background: #00ffcc;
  color: #000;
  border: none;
  padding: 10px 20px;
  font-size: 1.2em;
  cursor: pointer;
  margin-top: 10px;
  font-family: inherit;
}
button:hover {
  background: #00ccaa;
}
</style>
</head>
<body>
<h1>🐍 Neon Snake</h1>
<div id="score">Score: 0 | High: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="gameOver">
  <h2>Game Over!</h2>
  <p>Final Score: <span id="finalScore">0</span></p>
  <button onclick="restart()">Play Again</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const gameOverEl = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake = [{x: 10, y: 10}];
let direction = {x: 0, y: 0};
let food = {x: 15, y: 15};
let score = 0;
let highScore = localStorage.getItem('neonSnakeHigh') || 0;
let gameRunning = false;
let gameLoop;

function updateScore() {
  scoreEl.textContent = `Score: ${score} | High: ${highScore}`;
}

function randomFood() {
  food = {
    x: Math.floor(Math.random() * tileCount),
    y: Math.floor(Math.random() * tileCount)
  };
  // Avoid spawning on snake
  for (let segment of snake) {
    if (segment.x === food.x && segment.y === food.y) {
      randomFood();
      return;
    }
  }
}

function draw() {
  // Clear with trail effect
  ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw food with glow
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#ff0066';
  ctx.fillStyle = '#ff0066';
  ctx.beginPath();
  ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Draw snake with gradient
  snake.forEach((segment, index) => {
    const gradient = ctx.createLinearGradient(
      segment.x * gridSize, segment.y * gridSize,
      (segment.x + 1) * gridSize, (segment.y + 1) * gridSize
    );
    gradient.addColorStop(0, index === 0 ? '#00ffcc' : '#00aa88');
    gradient.addColorStop(1, '#006655');
    ctx.fillStyle = gradient;
    ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
    
    // Head eyes
    if (index === 0) {
      ctx.fillStyle = '#000';
      ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 4, 3, 3);
      ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 4, 3, 3);
    }
  });
}

function move() {
  if (!gameRunning) return;

  const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

  // Wall collision
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    endGame();
    return;
  }

  // Self collision
  for (let segment of snake) {
    if (segment.x === head.x && segment.y === head.y) {
      endGame();
      return;
    }
  }

  snake.unshift(head);

  // Eat food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('neonSnakeHigh', highScore);
    }
    updateScore();
    randomFood();
  } else {
    snake.pop();
  }

  draw();
}

function endGame() {
  gameRunning = false;
  clearInterval(gameLoop);
  finalScoreEl.textContent = score;
  gameOverEl.style.display = 'block';
}

function startGame() {
  gameRunning = true;
  direction = {x: 1, y: 0};
  gameOverEl.style.display = 'none';
  gameLoop = setInterval(move, 100);
  draw();
}

function restart() {
  snake = [{x: 10, y: 10}];
  direction = {x: 0, y: 0};
  score = 0;
  updateScore();
  randomFood();
  startGame();
}

document.addEventListener('keydown', (e) => {
  if (!gameRunning && (e.key.startsWith('Arrow') || ['w','a','s','d'].includes(e.key.toLowerCase()))) {
    startGame();
  }
  switch (e.key) {
    case 'ArrowUp':
    case 'w':
    case 'W':
      if (direction.y !== 1) direction = {x: 0, y: -1};
      break;
    case 'ArrowDown':
    case 's':
    case 'S':
      if (direction.y !== -1) direction = {x: 0, y: 1};
      break;
    case 'ArrowLeft':
    case 'a':
    case 'A':
      if (direction.x !== 1) direction = {x: -1, y: 0};
      break;
    case 'ArrowRight':
    case 'd':
    case 'D':
      if (direction.x !== -1) direction = {x: 1, y: 0};
      break;
  }
});

// Touch controls for mobile
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  if (!gameRunning) startGame();
});
canvas.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && direction.x !== -1) direction = {x: 1, y: 0};
    else if (dx < 0 && direction.x !== 1) direction = {x: -1, y: 0};
  } else {
    if (dy > 0 && direction.y !== -1) direction = {x: 0, y: 1};
    else if (dy < 0 && direction.y !== 1) direction = {x: 0, y: -1};
  }
});

updateScore();
randomFood();
draw();
</script>
</body>
</html>
